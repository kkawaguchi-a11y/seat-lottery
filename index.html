<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席次くじ引き</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#f5f7f5;--panel:#ffffff;--border:#d0e0d0;
    --green:#2e7d32;--green2:#43a047;--green3:#e8f5e9;
    --red:#c62828;--white:#ffffff;--muted:#757575;
    --done-bg:#e8f5e9;--done-border:#81c784;--done-text:#2e7d32;
    --fixed-bg:#e3f2fd;--fixed-border:#90caf9;--fixed-text:#1565c0;
    --text:#212121;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Zen Maru Gothic',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 56px;}
  header{text-align:center;margin-bottom:28px;}
  .title-en{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:6px;color:var(--green2);text-transform:uppercase;margin-bottom:8px;}
  h1{font-size:clamp(24px,5.5vw,42px);font-weight:900;letter-spacing:0.18em;color:var(--green);text-shadow:0 2px 8px rgba(46,125,50,0.15);}
  h1::before,h1::after{content:'🌿';font-size:0.5em;vertical-align:middle;margin:0 10px;}
  .subtitle{font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:2px;}
  .day-badge{display:inline-block;margin-top:10px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;padding:4px 12px;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:var(--white);}
  .day-badge.friday{border-color:var(--green);color:var(--green);background:var(--green3);}
  .sync-bar{display:flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:8px;justify-content:center;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background 0.4s;}
  .sync-dot.online{background:#2e7d32;box-shadow:0 0 6px #43a047;}
  .sync-dot.offline{background:var(--red);}
  .wrap{width:100%;max-width:860px;display:flex;flex-direction:column;gap:20px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 20px 22px;position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
  .panel-title{font-family:'Zen Maru Gothic',sans-serif;font-size:11px;letter-spacing:3px;color:var(--green2);text-transform:uppercase;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .step-header{display:flex;align-items:center;font-size:14px;letter-spacing:1px;color:var(--text);margin-bottom:14px;font-weight:700;}
  .step-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--green);color:#ffffff;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;margin-right:8px;flex-shrink:0;}
  .member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
  .member-chip{padding:10px 6px;background:#f9fbe7;border:1px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all 0.18s;user-select:none;}
  .member-chip:hover:not(.done):not(.me):not(.fixed){border-color:var(--green2);background:var(--green3);transform:translateY(-2px);box-shadow:0 4px 8px rgba(46,125,50,0.15);}
  .member-chip.me{background:var(--green3);border-color:var(--green);box-shadow:0 0 10px rgba(46,125,50,0.2);}
  .member-chip.done{background:var(--done-bg);border-color:var(--done-border);cursor:default;}
  .member-chip.fixed{background:var(--fixed-bg);border-color:var(--fixed-border);cursor:default;}
  .chip-name{font-size:14px;font-weight:700;color:var(--text);}
  .member-chip.me .chip-name{color:var(--green);}
  .member-chip.done .chip-name{color:var(--done-text);font-size:12px;}
  .member-chip.fixed .chip-name{color:var(--fixed-text);}
  .chip-sub{font-size:9px;color:var(--muted);margin-top:3px;}
  .member-chip.done .chip-sub{color:var(--done-text);}
  .member-chip.me .chip-sub{color:var(--green2);}
  .member-chip.fixed .chip-sub{color:var(--fixed-text);opacity:0.8;}
  .unlock-btn{display:inline-block;margin-top:5px;font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:8px;cursor:pointer;background:transparent;border:1px solid var(--fixed-border);color:var(--fixed-text);transition:all 0.18s;}
  .unlock-btn:hover{background:var(--fixed-bg);border-color:#1565c0;color:#1565c0;}
  .draw-stage{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .who-draws{font-size:14px;letter-spacing:1px;color:var(--muted);text-align:center;}
  .who-draws strong{color:var(--green);font-size:20px;font-weight:900;}
  .slot-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;}
  .slot{background:#f5f7f5;border:2px solid var(--border);border-radius:12px;width:120px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color 0.3s;}
  .slot.active{border-color:var(--green);background:var(--green3);}
  .slot-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--muted);margin-bottom:4px;}
  .slot-val{font-size:22px;font-weight:900;color:var(--text);letter-spacing:1px;min-height:30px;display:flex;align-items:center;}
  .slot.active .slot-val{color:var(--green);text-shadow:0 0 10px rgba(46,125,50,0.3);}
  @keyframes spin-tick{0%{transform:translateY(0);opacity:1;}30%{transform:translateY(-6px);opacity:0;}60%{transform:translateY(6px);opacity:0;}100%{transform:translateY(0);opacity:1;}}
  .spinning .slot-val{animation:spin-tick 0.1s ease-in-out;}
  .btn{font-family:'Zen Maru Gothic',sans-serif;font-size:12px;letter-spacing:1px;border:none;border-radius:12px;padding:13px 28px;cursor:pointer;transition:all 0.2s;font-weight:700;}
  .btn-primary{background:var(--green);color:#ffffff;}
  .btn-primary:hover:not(:disabled){background:var(--green2);transform:translateY(-2px);box-shadow:0 4px 12px rgba(46,125,50,0.3);}
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-warning{background:transparent;color:var(--green2);border:2px solid var(--green2);}
  .btn-warning:hover:not(:disabled){background:var(--green3);border-color:var(--green);}
  .btn-warning:disabled{opacity:0.3;cursor:not-allowed;}
  .btn-danger{background:transparent;color:var(--red);border:2px solid #ef9a9a;}
  .btn-danger:hover{background:#ffebee;border-color:var(--red);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .prog-wrap{width:100%;max-width:380px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
  .prog-bar{height:100%;background:linear-gradient(90deg,var(--green2),var(--green));transition:width 0.5s ease;border-radius:3px;}
  .status-bar{font-size:11px;letter-spacing:1px;color:var(--muted);text-align:center;}
  .results-table{width:100%;border-collapse:collapse;}
  .results-table th{font-size:10px;letter-spacing:2px;color:var(--green2);text-transform:uppercase;padding:7px 12px;text-align:left;border-bottom:1px solid var(--border);}
  .results-table td{padding:8px 12px;border-bottom:1px solid #f0f0f0;font-size:14px;}
  .results-table tr:last-child td{border-bottom:none;}
  .col-seat{color:var(--green);font-weight:700;width:130px;}
  .col-member{font-weight:700;}
  .col-tag{font-size:11px;color:var(--fixed-text);}
  .result-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:998;opacity:0;pointer-events:none;transition:opacity 0.3s;}
  .result-overlay.show{opacity:1;pointer-events:all;}
  .result-card{background:var(--white);border:2px solid var(--green);border-radius:20px;padding:36px 52px;text-align:center;box-shadow:0 8px 32px rgba(46,125,50,0.2);transform:scale(0.9);transition:transform 0.3s;max-width:90vw;}
  .result-overlay.show .result-card{transform:scale(1);}
  .rc-label{font-size:10px;letter-spacing:4px;color:var(--green2);margin-bottom:10px;}
  .rc-member{font-size:26px;font-weight:900;color:var(--text);margin-bottom:6px;}
  .rc-arrow{font-size:18px;color:var(--green2);margin:8px 0;}
  .rc-seat{font-size:52px;font-weight:900;color:var(--green);text-shadow:0 2px 8px rgba(46,125,50,0.2);}
  .rc-seat-label{font-size:11px;color:var(--muted);letter-spacing:3px;margin-top:4px;}
  .rc-close{margin-top:24px;font-family:'Zen Maru Gothic',sans-serif;font-size:11px;background:transparent;border:2px solid var(--border);color:var(--muted);padding:8px 20px;cursor:pointer;border-radius:10px;transition:all 0.2s;}
  .rc-close:hover{color:var(--text);border-color:var(--muted);}
  .notice{background:var(--fixed-bg);border:1px solid var(--fixed-border);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--fixed-text);letter-spacing:0.5px;display:flex;align-items:center;gap:8px;}
  .notice.active{background:var(--green3);border-color:var(--green2);color:var(--green);}
  .confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;overflow:hidden;}
  .cp{position:absolute;width:8px;height:8px;top:-20px;border-radius:50%;animation:cp-fall linear forwards;}
  @keyframes cp-fall{0%{top:-20px;opacity:1;transform:rotate(0deg) translateX(0);}100%{top:110vh;opacity:0;transform:rotate(720deg) translateX(var(--d));}}
  .drawing-lock{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:900;display:none;align-items:center;justify-content:center;}
  .drawing-lock.show{display:flex;}
  .drawing-lock-msg{font-family:'Zen Maru Gothic',sans-serif;font-size:14px;letter-spacing:2px;color:#ffffff;text-align:center;background:var(--green);padding:24px 36px;border-radius:16px;font-weight:700;}
</style>
</head>
<body>
<header>
  <div class="title-en">Seat Assignment Lottery</div>
  <h1>席次くじ引き</h1>
  <div class="subtitle">16名 / 席次 No.1–4・6–14 + 松本さん席×2</div>
  <div class="day-badge" id="dayBadge"></div>
  <div class="sync-bar">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncLabel">接続中...</span>
  </div>
</header>
<div class="wrap">
  <div class="notice" id="matsumotoNotice"></div>
  <div class="panel">
    <div class="step-header"><span class="step-badge">1</span>自分の名前を選んでください</div>
    <div class="member-grid" id="memberGrid"></div>
  </div>
  <div class="panel">
    <div class="step-header"><span class="step-badge">2</span>くじを引く</div>
    <div class="draw-stage">
      <div class="who-draws" id="whoDraws">名前を選択してください</div>
      <div class="slot-box">
        <div class="slot" id="slotMember"><div class="slot-label">MEMBER</div><div class="slot-val" id="slotMemberVal">—</div></div>
        <div style="font-size:22px;color:var(--green2);display:none" id="slotArrow">→</div>
        <div class="slot" id="slotSeat"><div class="slot-label">SEAT</div><div class="slot-val" id="slotSeatVal">—</div></div>
      </div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="drawBtn" onclick="draw()" disabled>🎋 くじを引く</button>
        <button class="btn btn-warning" id="undoBtn" onclick="confirmUndo()" disabled>↩ 1つ戻す</button>
        <button class="btn btn-danger" onclick="confirmReset()">↺ 全リセット</button>
      </div>
      <div class="status-bar" id="statusBar">0 / 15 完了</div>
    </div>
  </div>
  <div class="panel" id="resultsPanel" style="display:none">
    <div class="panel-title">▸ 席次一覧</div>
    <table class="results-table">
      <thead><tr><th>席次</th><th>メンバー</th><th></th></tr></thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="rc-label">✨ RESULT ✨</div>
    <div class="rc-member" id="rcMember">—</div>
    <div class="rc-arrow">▼</div>
    <div class="rc-seat" id="rcSeat">—</div>
    <div class="rc-seat-label" id="rcSeatLabel">SEAT No.</div>
    <button class="rc-close" onclick="closeOverlay()">閉じる ✕</button>
  </div>
</div>
<div class="drawing-lock" id="drawingLock">
  <div class="drawing-lock-msg">🎋 抽選中...<br><span style="font-size:11px;opacity:0.9;margin-top:8px;display:block;font-weight:400;">しばらくお待ちください</span></div>
</div>
<div class="confetti-wrap" id="confetti"></div>
<script>
const firebaseConfig={
  apiKey:"AIzaSyAuYuZJw5y1CIRAV9XENioRE7qHPw-gSS4",
  authDomain:"seat-lottery-13d7c.firebaseapp.com",
  databaseURL:"https://seat-lottery-13d7c-default-rtdb.firebaseio.com",
  projectId:"seat-lottery-13d7c",
  storageBucket:"seat-lottery-13d7c.firebasestorage.app",
  messagingSenderId:"368958433017",
  appId:"1:368958433017:web:5fc9594a964a03ff7a2428"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const STATE=db.ref('state');

const REGULAR_MEMBERS=['安松','鵜野','金原','熊谷','山口','小森','仁平','川口','倉田','大原','中原','鎮西','本橋','木村','傳田'];
const MATSUMOTO='松本';
const MATSUMOTO_SEAT_1='松本さん席①';
const MATSUMOTO_SEAT_2='松本さん席②';
const MATSUMOTO_SEATS=[MATSUMOTO_SEAT_1,MATSUMOTO_SEAT_2];
const NUMERIC_SEATS=[1,2,3,4,6,7,8,9,10,11,12,13,14];
const ALL_MEMBERS=[...REGULAR_MEMBERS,MATSUMOTO];
const DOW=new Date().getDay();
const IS_FRIDAY=DOW===5;

let me=null;
let animating=false;
let assignments={};
let matsumotoUnlocked=false;
let drawingBy=null;
let history=[];

STATE.on('value',function(snap){
  const d=snap.val()||{};
  assignments=d.assignments||{};
  matsumotoUnlocked=d.matsumotoUnlocked||false;
  drawingBy=d.drawingBy||null;
  history=d.history||[];
  const lock=document.getElementById('drawingLock');
  if(drawingBy&&drawingBy!==me){
    lock.classList.add('show');
    lock.querySelector('.drawing-lock-msg').innerHTML='🎋 '+drawingBy+' さんが抽選中...<br><span style="font-size:11px;opacity:0.9;margin-top:8px;display:block;font-weight:400;">しばらくお待ちください</span>';
  } else {
    lock.classList.remove('show');
  }
  render();
});

db.ref('.info/connected').on('value',function(snap){
  const on=snap.val();
  document.getElementById('syncDot').className='sync-dot '+(on?'online':'offline');
  document.getElementById('syncLabel').textContent=on?'リアルタイム同期中':'オフライン';
});

function getAvailableSeats(){
  const usedNums=new Set(Object.values(assignments).filter(function(s){return typeof s==='number';}));
  const seats=NUMERIC_SEATS.filter(function(s){return!usedNums.has(s);});
  if(IS_FRIDAY||matsumotoUnlocked){
    const usedSpecial=new Set(Object.values(assignments).filter(function(s){return MATSUMOTO_SEATS.includes(s);}));
    MATSUMOTO_SEATS.forEach(function(s){
      if(!usedSpecial.has(s))seats.push(s);
    });
  }
  return seats;
}

function isFixed(m){return m===MATSUMOTO&&!IS_FRIDAY&&!matsumotoUnlocked;}
function isDone(m){return!isFixed(m)&&(m in assignments);}

function selectMember(m){
  if(isFixed(m)||isDone(m)||animating||drawingBy)return;
  me=me===m?null:m;
  render();
}

async function draw(){
  if(!me||animating)return;
  const avail=getAvailableSeats();
  if(!avail.length)return;
  await db.ref('state/drawingBy').set(me);
  animating=true;
  render();
  const finalSeat=avail[Math.floor(Math.random()*avail.length)];
  const slotM=document.getElementById('slotMember');
  const slotS=document.getElementById('slotSeat');
  const valM=document.getElementById('slotMemberVal');
  const valS=document.getElementById('slotSeatVal');
  document.getElementById('slotArrow').style.display='';
  slotM.classList.add('active');slotS.classList.add('active');
  valM.textContent=me;
  for(let i=0;i<20;i++){
    slotS.classList.add('spinning');
    const r=avail[Math.floor(Math.random()*avail.length)];
    valS.textContent=typeof r==='number'?r:r;
    await sleep(55+i*4);
    slotS.classList.remove('spinning');
  }
  valS.textContent=typeof finalSeat==='number'?finalSeat:finalSeat;
  slotM.classList.remove('active');slotS.classList.remove('active');
  const newHistory=[...history,{member:me,seat:finalSeat}];
  await STATE.update({['assignments/'+me]:finalSeat,drawingBy:null,history:newHistory});
  animating=false;
  const winner=me;
  me=null;
  showOverlay(winner,finalSeat);
  const targets=IS_FRIDAY||matsumotoUnlocked?ALL_MEMBERS:REGULAR_MEMBERS;
  if(targets.every(function(m){return m in assignments;}))setTimeout(launchConfetti,600);
}

async function unlockMatsumoto(){
  await STATE.update({matsumotoUnlocked:true,['assignments/'+MATSUMOTO]:null});
}

function confirmReset(){
  if(!confirm('全ての結果をリセットしますか？\n全員の画面がリセットされます。'))return;
  doReset();
}

async function doReset(){
  const dow=new Date().getDay();
  const ns={assignments:{},matsumotoUnlocked:false,drawingBy:null,history:[],lastReset:dateStr()};
  if(dow!==5){
    ns.assignments[MATSUMOTO]=MATSUMOTO_SEAT_1;
  }
  await STATE.set(ns);
  me=null;animating=false;
  resetSlots();
  updateDayBadge(dow);
}

function confirmUndo(){
  if(!confirm('直前の抽選結果を1つ取り消しますか？'))return;
  doUndo();
}

async function doUndo(){
  if(!history.length)return;
  const last=history[history.length-1];
  const newHistory=history.slice(0,-1);
  await db.ref('state/assignments/'+last.member).remove();
  if(newHistory.length){
    await db.ref('state/history').set(newHistory);
  } else {
    await db.ref('state/history').remove();
  }
  resetSlots();
}

function showOverlay(member,seat){
  document.getElementById('rcMember').textContent=member+' さん';
  const el=document.getElementById('rcSeat');
  const lb=document.getElementById('rcSeatLabel');
  if(MATSUMOTO_SEATS.includes(seat)){
    el.style.fontSize='24px';el.textContent=seat;lb.textContent='';
  } else {
    el.style.fontSize='52px';el.textContent=seat;lb.textContent='SEAT No.';
  }
  document.getElementById('resultOverlay').classList.add('show');
}
function closeOverlay(){document.getElementById('resultOverlay').classList.remove('show');}

function render(){
  renderGrid();
  renderWho();
  renderDrawBtn();
  renderUndoBtn();
  renderTable();
  renderProgress();
  renderNotice();
}

function renderGrid(){
  const g=document.getElementById('memberGrid');
  g.innerHTML='';
  ALL_MEMBERS.forEach(function(m){
    const div=document.createElement('div');
    const fixed=isFixed(m);
    const done=isDone(m);
    const isMe=me===m;
    div.className='member-chip'+(fixed?' fixed':done?' done':isMe?' me':'');
    if(fixed){
      div.innerHTML='<div class="chip-name">'+m+'</div>'
        +'<div class="chip-sub">①②固定</div>'
        +'<button class="unlock-btn" onclick="unlockMatsumoto()">🔓 固定解除</button>';
    } else if(done){
      const s=assignments[m];
      const label=MATSUMOTO_SEATS.includes(s)?s:'No.'+s;
      div.innerHTML='<div class="chip-name">✓ '+m+'</div><div class="chip-sub">'+label+'</div>';
    } else {
      div.innerHTML='<div class="chip-name">'+m+'</div><div class="chip-sub">'+(isMe?'選択中 ✨':'タップして選択')+'</div>';
      div.addEventListener('click',function(){selectMember(m);});
    }
    g.appendChild(div);
  });
}

function renderWho(){
  document.getElementById('whoDraws').innerHTML=me?'<strong>'+me+'</strong> さんのくじ 🎋':'名前を選択してください';
}

function renderDrawBtn(){
  const ok=me&&!isDone(me)&&getAvailableSeats().length>0&&!animating&&!drawingBy;
  document.getElementById('drawBtn').disabled=!ok;
}

function renderUndoBtn(){
  document.getElementById('undoBtn').disabled=history.length===0||!!drawingBy||animating;
}

function renderTable(){
  const tbody=document.getElementById('resultsBody');
  tbody.innerHTML='';
  const entries=Object.entries(assignments);
  if(!entries.length){document.getElementById('resultsPanel').style.display='none';return;}
  entries.sort(function(a,b){
    const sa=typeof a[1]==='number'?a[1]:9999;
    const sb=typeof b[1]==='number'?b[1]:9999;
    return sa-sb;
  });
  entries.forEach(function(e){
    const name=e[0],seat=e[1];
    const isMF=MATSUMOTO_SEATS.includes(seat);
    const tr=document.createElement('tr');
    tr.innerHTML='<td class="col-seat" style="'+(isMF?'color:var(--fixed-text);font-size:11px;':'')+'">'+( isMF?seat:'No. '+seat)+'</td><td class="col-member">'+name+'</td><td class="col-tag">'+(isMF?'固定':'')+'</td>';
    tbody.appendChild(tr);
  });
  document.getElementById('resultsPanel').style.display='';
}

function renderProgress(){
  const targets=IS_FRIDAY||matsumotoUnlocked?ALL_MEMBERS:REGULAR_MEMBERS;
  const total=targets.length;
  const done=targets.filter(function(m){
    if(m===MATSUMOTO&&!IS_FRIDAY&&!matsumotoUnlocked)return false;
    return m in assignments;
  }).length;
  document.getElementById('progBar').style.width=(done/total*100)+'%';
  document.getElementById('statusBar').textContent=done+' / '+total+' 完了 🌿';
}

function renderNotice(){
  const n=document.getElementById('matsumotoNotice');
  if(IS_FRIDAY){
    n.className='notice active';
    n.innerHTML='🗓️ 本日は金曜日です。松本さんも通常メンバーとしてくじに参加します。';
  } else if(matsumotoUnlocked){
    n.className='notice active';
    n.innerHTML='🔓 松本さんの固定を解除しました。「松本さん席①②」もくじの対象に加わります。';
  } else {
    n.className='notice';
    n.innerHTML='📌 松本さんは「松本さん席①・②」固定です。「固定解除」でくじに参加できます。';
  }
}

function resetSlots(){
  document.getElementById('slotMemberVal').textContent='—';
  document.getElementById('slotSeatVal').textContent='—';
  document.getElementById('slotArrow').style.display='none';
}

function updateDayBadge(dow){
  const days=['日','月','火','水','木','金','土'];
  const badge=document.getElementById('dayBadge');
  badge.textContent='🌿 本日 '+days[dow]+'曜日';
  badge.classList.toggle('friday',dow===5);
}

function scheduleAutoReset(){
  const now=new Date();
  const next=new Date(now);
  next.setHours(24,0,5,0);
  setTimeout(async function(){await doReset();scheduleAutoReset();},next-now);
}

function dateStr(){
  const d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}

function launchConfetti(){
  const c=document.getElementById('confetti');
  const cols=['#2e7d32','#43a047','#81c784','#ffffff','#a5d6a7','#1b5e20'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div');p.className='cp';
    p.style.cssText='left:'+Math.random()*100+'vw;background:'+cols[i%cols.length]+';animation-duration:'+(1.6+Math.random()*2)+'s;animation-delay:'+Math.random()*0.8+'s;--d:'+(Math.random()*220-110)+'px';
    c.appendChild(p);setTimeout(function(){p.remove();},4000);
  }
}

function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

(async function(){
  updateDayBadge(DOW);
  renderNotice();
  await db.ref('state/drawingBy').remove();
  const snap=await STATE.once('value');
  if(!snap.val()||!snap.val().assignments){
    await doReset();
  }
  scheduleAutoReset();
})();
</script>
</body>
